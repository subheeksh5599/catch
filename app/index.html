<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catch</title>
  <meta name="description" content="A vault that rests orders on the dreamDEX perps book where liquidations will land, re-checked by Somnia Reactivity in the same block." />
  <link rel="icon" href="./mark.svg" type="image/svg+xml" />
  <link rel="preload" href="./fonts/Geist.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="/" aria-label="Catch home">
        <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><path fill="#ededed" fill-rule="evenodd" d="M 21.76 0 C 25.344 0 27.137 0 28.506 0.697 C 29.71 1.311 30.689 2.29 31.303 3.494 C 32 4.863 32 6.656 32 10.24 L 32 21.76 C 32 25.344 32 27.137 31.303 28.506 C 30.689 29.71 29.71 30.689 28.506 31.303 C 27.137 32 25.344 32 21.76 32 L 10.24 32 C 6.656 32 4.863 32 3.494 31.303 C 2.29 30.689 1.311 29.71 0.697 28.506 C 0 27.137 0 25.344 0 21.76 L 0 10.24 C 0 6.656 0 4.863 0.697 3.494 C 1.311 2.29 2.29 1.311 3.494 0.697 C 4.863 0 6.656 0 10.24 0 Z M 8 14 L 8 19 C 8 23.4 11.6 26 16 26 C 20.4 26 24 23.4 24 19 L 24 14 L 20.8 14 L 20.8 19 C 20.8 21.6 18.6 22.8 16 22.8 C 13.4 22.8 11.2 21.6 11.2 19 L 11.2 14 Z M 18.5 9 A 2.5 2.5 0 0 0 13.5 9 A 2.5 2.5 0 0 0 18.5 9 Z"/></svg>
        <span>Catch</span>
      </a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="#/" data-route="overview"><svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v3H9zM9 7h5v7H9zM2 9h5v5H2z"/></svg>Overview</a>
        <a href="#/vault" data-route="vault"><svg viewBox="0 0 16 16"><path d="M2 3h12v10H2zM8 8m-2.25 0a2.25 2.25 0 1 0 4.5 0a2.25 2.25 0 1 0-4.5 0M5 13v1M11 13v1"/></svg>Vault</a>
        <div class="nav-label">Venue data</div>
        <a href="#/map" data-route="map"><svg viewBox="0 0 16 16"><path d="M2 14V8M5 14V4M8 14V9M11 14V6M14 14V10M1 14h14"/></svg>Liquidation map</a>
        <a href="#/markets" data-route="markets"><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/></svg>Markets</a>
        <a href="#/liquidations" data-route="liquidations"><svg viewBox="0 0 16 16"><path d="M8 2v8M5 7l3 3 3-3M2 13h12"/></svg>Liquidations</a>
        <a href="#/contracts" data-route="contracts"><svg viewBox="0 0 16 16"><path d="M5 5L2 8l3 3M11 5l3 3-3 3M9 3l-2 10"/></svg>Contracts</a>
      </nav>
      <div class="side-foot">
        <div class="net"><span class="dot" id="liveDot"></span><span id="netName">Connecting</span></div>
        <div class="mono" id="headBlock">reading chain</div>
      </div>
    </aside>
    <div class="main">
      <header class="top">
        <div class="crumbs"><h1 id="title">Overview</h1><span class="sub" id="subtitle"></span></div>
        <div class="top-actions">
          <div id="marketPick"></div>
          <button class="btn quiet" id="connect">Connect wallet</button>
        </div>
      </header>
      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>
  <div class="tip" id="tip" hidden></div>
  <script type="module" src="./js/main.mjs"></script>
</body>
</html>
